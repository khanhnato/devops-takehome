# Argo CD Helm values for the local lab: minimal footprint, UI on a NodePort
# that k3d maps to http://localhost:${ARGOCD_PORT:-8081}.
configs:
  params:
    server.insecure: true   # plain HTTP inside the lab; TLS would terminate at the ingress in prod
  cm:
    timeout.reconciliation: 60s

server:
  service:
    type: NodePort
    nodePortHttp: 30080

dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1

# Keep control-plane tooling off the GPU node (it is tainted anyway) and off
# spot capacity where possible, like we would in prod.
global:
  affinity:
    nodeAffinity:
      type: soft
      matchExpressions:
        - key: acme.io/capacity
          operator: In
          values: [on-demand]
