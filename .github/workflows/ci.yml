# CI/CD for quote-api, migrated from ci/legacy.gitlab-ci.yml.
# See MIGRATION-NOTES.md for what changed and why.
#
#   PR / push ─┬─ sast   (Semgrep, blocking)
#              ├─ test   (go vet + go test -race, blocking)
#              └─ chart  (helm lint + render)
#                    └─ image  (build → Trivy gate → push to GHCR :<git-sha> → cosign sign)   [main only pushes]
#                          └─ deploy (GitOps: bump image tag in charts/quote-api/values.yaml; Argo CD syncs it)
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.182.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --error: any finding fails the job. No allow_failure, no `|| true`.
      - name: Semgrep scan
        run: >
          semgrep scan --error --metrics=off
          --config p/golang --config p/dockerfile
          --config p/github-actions --config p/secrets

  test:
    name: Go vet + tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  chart:
    name: Helm lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - run: helm lint charts/quote-api
      - run: helm template quote-api charts/quote-api > /dev/null

  image:
    name: Build, scan, push
    needs: [sast, test, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to GHCR with the workflow token, no long-lived secret
      id-token: write   # keyless cosign signing (OIDC)
    outputs:
      image: ${{ steps.ref.outputs.image }}
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image reference
        id: ref
        run: echo "image=ghcr.io/${OWNER,,}/quote-api" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      # 1) Build for the runner's arch only and load it, so it can be scanned before anything is pushed.
      - name: Build (for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: quote-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Gate: HIGH/CRITICAL vulnerabilities with an available fix fail the build.
      - name: Trivy scan (blocking)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0 image --no-progress --exit-code 1
          --severity HIGH,CRITICAL --ignore-unfixed quote-api:scan

      # 3) Only main publishes. Tag = full git SHA (immutable); `latest` is a convenience alias only.
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
      - name: Sign image (keyless)
        if: env.PUSH == 'true'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}

  deploy:
    name: GitOps bump
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      # Deploy = a reviewed, revertible commit in Git. Argo CD picks it up; the
      # pipeline never holds cluster credentials (replaces `kubectl set image`).
      - name: Point the chart at the new image
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ github.sha }}
        run: |
          sed -i -E "s#^(  repository:).*#\1 ${IMAGE}#; s#^(  tag:).*#\1 \"${TAG}\"#" charts/quote-api/values.yaml
          git diff --exit-code --quiet && { echo "already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: quote-api ${TAG::7} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
